name: Firmware build (caihong)

on:
  workflow_dispatch:
    inputs:
      uefi_repository:
        description: Mu-Silicium checkout carrying the caihong platform package
        required: true
        default: huohua135/uefi-caihong
      uefi_ref:
        description: Ref of that repository
        required: true
        default: sheng
      device_repository:
        description: Device repository (source of the uefi overlay)
        required: true
        default: huohua135/UniXNU-caihong
      device_ref:
        description: Device repository ref
        required: true
        default: main
      defconfig:
        description: Defconfig name in configs/ of the device repository
        required: true
        default: caihong_defconfig

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    # Built through UniXNU's own firmware step (EDK II directly) instead of build_uefi.py:
    # the stuart wrapper insists on fetching the mu_nasm NuGet package, which fails on the
    # hosted Linux image. The overlay FDF packs CaihongInitrdDxe, UniXNU, UniXNUDxe and
    # DarwinBoot; the 2026-10-22 fd-caihong artifact only carried the last two.
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      UNIXNU_DEVICE: ${{ github.workspace }}/device
      DEFCONFIG: ${{ inputs.defconfig }}
    steps:
      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: unixnu
          persist-credentials: false

      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.device_repository }}
          ref: ${{ inputs.device_ref }}
          path: device
          token: ${{ secrets.UNIXNU_DEVICE_TOKEN || github.token }}

      - name: Check out the Mu-Silicium base
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.uefi_repository }}
          ref: ${{ inputs.uefi_ref }}
          path: uefi
          submodules: recursive
          token: ${{ secrets.UNIXNU_DEVICE_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply the device overlay
        run: |
          set -euxo pipefail
          cp -r device/uefi-overlay/Platforms/. uefi/Platforms/
          cp -r device/uefi-overlay/Resources/. uefi/Resources/
          grep -E 'CaihongInitrdDxe|DarwinBoot' uefi/Platforms/OnePlus/caihongPkg/caihong.fdf
          grep -E 'CaihongInitrdDxe|DarwinBoot' uefi/Platforms/OnePlus/caihongPkg/caihong.dsc

      - name: Wait for working DNS and apt mirrors
        run: |
          sudo sh -c 'printf "nameserver 1.1.1.1\nnameserver 8.8.8.8\n" > /etc/resolv.conf'
          for attempt in $(seq 1 6); do
            if getent hosts archive.ubuntu.com >/dev/null; then
              sudo apt-get -o Acquire::Retries=10 update && exit 0
              echo "apt update failed, retrying"
            fi
            sleep 10
          done
          echo "::error::apt mirrors unreachable"; exit 1

      - name: Install the host tools
        run: |
          sudo apt-get install -y --no-install-recommends clang lld llvm cmake ninja-build python3 \
            python3-pip uuid-dev libssl-dev device-tree-compiler mtools build-essential
          for v in 22 21 20 19 18; do
            if [ -x "/usr/bin/llvm-objcopy-$v" ] && ! command -v llvm-objcopy >/dev/null; then
              sudo ln -sf "/usr/bin/llvm-objcopy-$v" /usr/local/bin/llvm-objcopy
            fi
          done
          command -v llvm-objcopy

      - name: Resolve the device configuration
        working-directory: unixnu
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts')
          from unixnu.cli import parser, cmd_defconfig
          from unixnu.config import Context
          ctx = Context(parser().parse_args(['defconfig', os.environ['DEFCONFIG'], '-D', '../device']))
          cmd_defconfig(ctx)
          print('work:', ctx.work)
          PY

      - name: Build the firmware
        working-directory: unixnu
        run: |
          set -o pipefail
          ./unixnu build firmware --uefi ../uefi --edk2 ../uefi/Mu_Basecore 2>&1 | tail -n 200

      - name: Show the products
        if: always()
        run: |
          ls -l uefi/Build/caihongPkg/*/FV/* 2>/dev/null || true
          sha256sum uefi/Build/caihongPkg/*/FV/*.fd uefi/BootShim/BootShim.bin 2>/dev/null || true

      - name: Upload the firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-caihong-${{ github.run_attempt }}
          path: |
            uefi/Build/caihongPkg/*/FV/*.fd
            uefi/Build/caihongPkg/*/FV/*.gz
            uefi/BootShim/BootShim.bin
          if-no-files-found: warn
          retention-days: 14
