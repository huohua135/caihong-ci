name: Firmware build (caihong)

on:
  workflow_dispatch:
    inputs:
      uefi_repository:
        description: Mu-Silicium checkout carrying the caihong platform package
        required: true
        default: huohua135/uefi-caihong
      uefi_ref:
        description: Ref of that repository
        required: true
        default: sheng
      device_repository:
        description: Device repository (source of the uefi overlay)
        required: true
        default: huohua135/UniXNU-caihong
      device_ref:
        description: Device repository ref
        required: true
        default: main

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    # GitHub disabled Actions on huohua135/UniXNU (a fork), so this workflow lives in its own
    # repository and checks the UniXNU tree out beside the device repository instead.
    # The overlay FDF packs CaihongInitrdDxe, UniXNU, UniXNUDxe and DarwinBoot; the 2026-10-22
    # fd-caihong artifact only carried the last two, which is why that image never lit the panel.
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: unixnu
          persist-credentials: false

      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.device_repository }}
          ref: ${{ inputs.device_ref }}
          path: device
          token: ${{ secrets.UNIXNU_DEVICE_TOKEN || github.token }}

      - name: Check out the Mu-Silicium base
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.uefi_repository }}
          ref: ${{ inputs.uefi_ref }}
          path: uefi
          submodules: recursive
          token: ${{ secrets.UNIXNU_DEVICE_TOKEN || github.token }}

      - name: Apply the device overlay
        run: |
          set -euxo pipefail
          cp -r device/uefi-overlay/Platforms/. uefi/Platforms/
          cp -r device/uefi-overlay/Resources/. uefi/Resources/
          cp device/uefi-overlay/build_uefi.py uefi/build_uefi.py
          cp device/uefi-overlay/UniXNU/package/UniXNUPkg/Library/UniXNULib/Main.c \
             unixnu/package/UniXNUPkg/Library/UniXNULib/Main.c
          rm -rf uefi/UniXNU
          ln -sfn "$PWD/unixnu" uefi/UniXNU
          grep -E 'CaihongInitrdDxe|DarwinBoot' uefi/Platforms/OnePlus/caihongPkg/caihong.fdf

      - name: Install the host tools
        run: |
          sudo sh -c 'printf "nameserver 1.1.1.1\nnameserver 8.8.8.8\n" > /etc/resolv.conf'
          sudo apt-get -o Acquire::Retries=10 update
          # mu_nasm is delivered as a NuGet package and stuart needs Mono to unpack it on Linux
          sudo apt-get install -y --no-install-recommends clang lld llvm cmake ninja-build python3 \
            python3-pip uuid-dev libssl-dev device-tree-compiler mtools build-essential mono-devel ca-certificates-mono
          for v in 22 21 20 19 18; do
            if [ -x "/usr/bin/llvm-objcopy-$v" ] && ! command -v llvm-objcopy >/dev/null; then
              sudo ln -sf "/usr/bin/llvm-objcopy-$v" /usr/local/bin/llvm-objcopy
            fi
          done
          command -v llvm-objcopy
          python3 -m pip install --break-system-packages --no-input -r uefi/pip-requirements.txt

      - name: Build the firmware
        working-directory: uefi
        run: |
          set -o pipefail
          python3 build_uefi.py -d caihong -m 0 -r RELEASE 2>&1 | tail -n 300

      - name: Show the products
        if: always()
        run: |
          ls -l uefi/Build/*/RELEASE_CLANGPDB/FV/* 2>/dev/null || true
          ls -l uefi/Mu-*.img 2>/dev/null || true
          sha256sum uefi/Build/*/RELEASE_CLANGPDB/FV/*.fd uefi/Mu-*.img uefi/BootShim/BootShim.bin 2>/dev/null || true

      - name: Upload the firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-caihong-${{ github.run_attempt }}
          path: |
            uefi/Build/*/RELEASE_CLANGPDB/FV/*.fd
            uefi/Build/*/RELEASE_CLANGPDB/FV/*.gz
            uefi/Mu-*.img
            uefi/BootShim/BootShim.bin
          if-no-files-found: warn
          retention-days: 14
